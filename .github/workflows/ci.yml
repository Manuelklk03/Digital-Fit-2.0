# Integración y entrega continua: prueba backend y frontend en cada PR y en main,
# y publica las imágenes en Docker Hub en cada push a main y en cada tag v*.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# Un push nuevo a la misma rama cancela la ejecución anterior, que ya no sirve.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend/digital-fit

    # PostgreSQL de usar y tirar para los tests, igual que en docker-compose.yml.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: digital_fit
          POSTGRES_USER: digitalfit
          POSTGRES_PASSWORD: digitalfit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U digitalfit -d digital_fit"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_URL: jdbc:postgresql://localhost:5432/digital_fit
      DB_USERNAME: digitalfit
      DB_PASSWORD: digitalfit

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Compilar y ejecutar tests
        run: ./mvnw -B verify

      # JAR de las dependencias (Spring, Lombok...) para que Sonar resuelva sus tipos.
      - name: Copiar dependencias para Sonar
        run: ./mvnw -B -q dependency:copy-dependencies -DincludeScope=test -DoutputDirectory=target/dependency

      # Clases compiladas, dependencias y cobertura de JaCoCo para el job de SonarQube.
      - uses: actions/upload-artifact@v4
        with:
          name: backend-analisis
          path: |
            Backend/digital-fit/target/classes
            Backend/digital-fit/target/dependency
            Backend/digital-fit/target/site/jacoco/jacoco.xml
          retention-days: 1

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend/digital-fit-frontend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Frontend/digital-fit-frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Tests con cobertura
        run: npm test -- --watch=false --coverage --coverage-reporters=lcov

      # lcov escribe rutas relativas al frontend (src/...); Sonar analiza desde la raíz del repo.
      - name: Ajustar rutas de cobertura para Sonar
        run: sed -i 's#^SF:#SF:Frontend/digital-fit-frontend/#' coverage/digital-fit-frontend/lcov.info

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-cobertura
          path: Frontend/digital-fit-frontend/coverage/digital-fit-frontend/lcov.info
          retention-days: 1

      - name: Build de producción
        run: npm run build

  lint:
    name: Frontend (lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend/digital-fit-frontend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Frontend/digital-fit-frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar formato con Prettier
        run: npm run format:check

      # Falla con errores; los avisos (deuda de la v1) se muestran pero no bloquean.
      - name: ESLint
        run: npm run lint

  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    # Espera a los tests para usar sus informes de cobertura. Los tags no se analizan:
    # su código ya se analizó en main.
    needs: [backend, frontend]
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}

    steps:
      - uses: actions/checkout@v5
        with:
          # Historial completo: Sonar lo usa para saber qué líneas son código nuevo.
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: backend-analisis
          path: Backend/digital-fit/target

      - uses: actions/download-artifact@v4
        with:
          name: frontend-cobertura
          path: Frontend/digital-fit-frontend/coverage/digital-fit-frontend

      # Lee sonar-project.properties. En las PR, qualitygate.wait hace fallar el job si el
      # Quality Gate falla (y bloquea el merge); en main solo actualiza el panel de Sonar.
      - uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.qualitygate.wait=${{ github.event_name == 'pull_request' }}

  docker:
    name: Docker (compose)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # --wait espera a que todos los servicios pasen su healthcheck (falla si alguno no lo logra).
      - name: Construir y levantar la aplicación
        run: docker compose up -d --build --wait --wait-timeout 180

      # Prueba de humo: la aplicación completa responde a través de nginx, como en producción.
      - name: Prueba de humo
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4200/api/auth/me)
          echo "API a través de nginx (sin sesión): $code"
          test "$code" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/actuator/health)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/actuator/env)" != "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4200/)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4200/mis-entrenamientos)" = "200"
          echo "Usuario del backend: $(docker compose exec -T backend id -u), del frontend: $(docker compose exec -T frontend id -u)"
          test "$(docker compose exec -T backend id -u)" != "0"
          test "$(docker compose exec -T frontend id -u)" != "0"

      - name: Logs de los contenedores
        if: failure()
        run: docker compose logs --no-color --tail 100

      - name: Parar la aplicación
        if: always()
        run: docker compose down -v

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Instalar dependencias E2E
        run: npm ci
        working-directory: e2e

      - name: Instalar navegadores de Playwright
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      # --wait espera a que postgres, backend y frontend superen sus healthchecks
      - name: Levantar la aplicación con Docker Compose
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: Ejecutar pruebas E2E
        run: npm test
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost:4200

      - name: Logs de los contenedores si falla
        if: failure()
        run: docker compose logs --no-color --tail 100

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Parar la aplicación
        if: always()
        run: docker compose down -v

  publish:
    name: Publicar imagen ${{ matrix.imagen }}
    runs-on: ubuntu-latest
    # Solo en push (merge a main o tag v*) y con todas las comprobaciones en verde.
    if: github.event_name == 'push'
    needs: [backend, frontend, lint, docker, e2e]
    strategy:
      matrix:
        include:
          - imagen: backend
            contexto: Backend/digital-fit
          - imagen: frontend
            contexto: Frontend/digital-fit-frontend

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Etiquetas: latest (main), sha-xxxxxxx (cada commit) y 2.0.0 (tag v2.0.0).
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/digital-fit-${{ matrix.imagen }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.contexto }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.imagen }}
          cache-to: type=gha,mode=max,scope=${{ matrix.imagen }}

      # Notifica al backend en Render mediante su deploy hook (tarea 1B.5).
      # Se ejecuta tras publicar la imagen del backend en merges a main y se omite
      # de forma limpia mientras el secreto RENDER_DEPLOY_HOOK no exista.
      - name: Notificar deploy hook en Render (backend)
        if: matrix.imagen == 'backend' && github.ref == 'refs/heads/main'
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            curl -fsS -X POST "$RENDER_DEPLOY_HOOK"
          else
            echo "Secreto RENDER_DEPLOY_HOOK no configurado. Omitiendo notificación de despliegue."
          fi
