# Análisis de SonarQube Cloud (lo lanza el job «SonarQube» de .github/workflows/ci.yml).
sonar.organization=manuelklk03
sonar.projectKey=Manuelklk03_Digital-Fit-Proyecto
sonar.projectName=Digital-Fit
sonar.sourceEncoding=UTF-8

# Código de la aplicación y tests de backend y frontend (un solo proyecto Sonar).
sonar.sources=Backend/digital-fit/src/main,Frontend/digital-fit-frontend/src
sonar.tests=Backend/digital-fit/src/test,Frontend/digital-fit-frontend/src
sonar.exclusions=Frontend/digital-fit-frontend/src/**/*.spec.ts
sonar.test.inclusions=Backend/digital-fit/src/test/**,Frontend/digital-fit-frontend/src/**/*.spec.ts

# Clases compiladas de Java (las genera el job del backend).
sonar.java.binaries=Backend/digital-fit/target/classes

# Informes de cobertura generados en la CI.
sonar.coverage.jacoco.xmlReportPaths=Backend/digital-fit/target/site/jacoco/jacoco.xml
sonar.javascript.lcov.reportPaths=Frontend/digital-fit-frontend/coverage/digital-fit-frontend/lcov.info
