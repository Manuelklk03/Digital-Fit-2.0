# ===================================================================
# Perfil DESARROLLO (dev) - Logging detallado y depuración SQL (P10)
# ===================================================================

# Depuración SQL de Hibernate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Niveles de log para desarrollo
logging.level.root=INFO
logging.level.com.example.digital_fit=DEBUG
logging.level.org.springframework.jdbc.datasource.init=DEBUG

# Archivo de logs de desarrollo
logging.file.name=logs/digitalfit-dev.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
