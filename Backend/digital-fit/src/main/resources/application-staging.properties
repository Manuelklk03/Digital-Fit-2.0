# ===================================================================
# Perfil STAGING (staging) - Validación preproducción (D3, P4, P10)
# ===================================================================

# En staging el esquema se valida estrictamente contra Flyway (igual que prod)
spring.jpa.hibernate.ddl-auto=validate

# Sin volcado ni formateo SQL
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Niveles de log para staging: trazabilidad sin sobrecarga
logging.level.root=INFO
logging.level.com.example.digital_fit=INFO
logging.level.org.flywaydb=INFO
logging.level.org.springframework.jdbc.datasource.init=INFO

# Archivo de logs de staging
logging.file.name=logs/digitalfit-staging.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Protección de información sensible en respuestas
server.error.include-stacktrace=never
server.error.include-message=never
