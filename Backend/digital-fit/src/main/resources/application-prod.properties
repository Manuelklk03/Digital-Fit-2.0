# ===================================================================
# Perfil PRODUCCIÓN (prod) - Alto rendimiento, sin volcado SQL (P10)
# ===================================================================

# Sin volcado ni formateo SQL en producción
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Niveles de log mínimos y seguros
logging.level.root=WARN
logging.level.com.example.digital_fit=INFO
logging.level.org.springframework.jdbc.datasource.init=WARN

# Archivo de logs de producción
logging.file.name=logs/digitalfit.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Protección de información sensible en respuestas del servidor
server.error.include-stacktrace=never
server.error.include-message=never
