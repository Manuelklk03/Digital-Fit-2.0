spring.application.name=digital_fit

# Perfil activo (dev por defecto, sobreescribible por variable de entorno)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Conexión a Base de Datos
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/digital_fit}
spring.datasource.username=${DB_USERNAME:digitalfit}
spring.datasource.password=${DB_PASSWORD:digitalfit}

# Migraciones Flyway (D3, P4)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Desactivar inicialización SQL legacy
spring.sql.init.mode=never

# Seguridad de sesión y cookies (D2, P2):
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# CORS dinámico por entorno (P3):
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Reenvío de cabeceras de proxy inverso (Netlify / Render)
server.forward-headers-strategy=framework

# Exposición segura de Actuator (solo healthcheck sin detalles)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
