spring.application.name=digital_fit

# Perfil activo (dev por defecto, sobreescribible por variable de entorno)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Conexión a Base de Datos
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/digital_fit}
spring.datasource.username=${DB_USERNAME:digitalfit}
spring.datasource.password=${DB_PASSWORD:digitalfit}

# Inicialización JPA y scripts SQL
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.sql.init.continue-on-error=true

# Seguridad de sesión y cookies (D2, P2):
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# CORS dinámico por entorno (P3):
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
