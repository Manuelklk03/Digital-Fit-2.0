spring.application.name=digital_fit
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/digital_fit}
spring.datasource.username=${DB_USERNAME:digitalfit}
spring.datasource.password=${DB_PASSWORD:digitalfit}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.sql.init.continue-on-error=true

logging.level.org.springframework.jdbc.datasource.init=DEBUG

#LOGS:

# Ruta de logs
logging.file.name=logs/digitalfit.log

# Nivel de logs
logging.level.root=INFO
logging.level.com.example.digital_fit=DEBUG

# Formato
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Seguridad de sesión y cookies (D2, P2):
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# CORS por entorno (P3):
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
