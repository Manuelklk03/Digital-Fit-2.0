# ===================================================================
# Digital-Fit 2.0 — Configuración de despliegue en Netlify (D2, D9)
# ===================================================================
# Frontend estático Angular servido en CDN global con proxy inverso
# para /api/* hacia el backend en Render, manteniendo cookies de
# primera parte (SameSite=Lax, HttpOnly) y evitando problemas de CORS.

[build]
  base = "Frontend/digital-fit-frontend"
  publish = "dist/digital-fit-frontend/browser"
  command = "npm run build"

# Proxy reverso hacia la API en Render (D2, D9)
# En staging o prod la URL de destino se puede sobrescribir con variables
# de entorno en el panel de Netlify.
[[redirects]]
  from = "/api/*"
  to = "https://digital-fit-backend.onrender.com/api/:splat"
  status = 200
  force = true
  headers = {X-Forwarded-Host = "digital-fit.netlify.app"}

# Soporte para Angular Single Page Application (HTML5 pushState routing)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Páginas privadas: no se indexan aunque el rastreador no ejecute JavaScript (la etiqueta robots solo la pone Angular).
# Las públicas (/inicio, /login, /register) no llevan esta cabecera. Comprobar tras un cambio con: curl -sI <url>/mis-centros | grep -i x-robots
[[headers]]
  for = "/entrenar"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/explorar"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/estadisticas"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/valoraciones"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/privados*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/publicos*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/entrenamientos*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/historial-entrenamientos*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/mis-*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
