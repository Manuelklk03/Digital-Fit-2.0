services:
  postgres:
    image: postgres:17-alpine
    container_name: digital-fit-postgres
    restart: always
    environment:
      POSTGRES_DB: digital_fit
      POSTGRES_USER: ${DB_USERNAME:-digitalfit}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-digitalfit}
    ports:
      - "5433:5432"
    volumes:
      - digital_fit_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./Backend/digital-fit
    container_name: digital-fit-backend
    restart: always
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/digital_fit
      DB_USERNAME: ${DB_USERNAME:-digitalfit}
      DB_PASSWORD: ${DB_PASSWORD:-digitalfit}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./Frontend/digital-fit-frontend
    container_name: digital-fit-frontend
    restart: always
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  digital_fit_postgres_data:
