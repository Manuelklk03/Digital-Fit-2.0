@let m = i18n.t().lugares.mapa;
<div class="mapa">
  @if (!soloVista()) {
    <div class="barra" role="search">
      <label class="sr-only" for="mapa-busqueda">{{ m.buscarEtiqueta }}</label>
      <input df-input size="sm" id="mapa-busqueda" type="search" name="textoBusqueda" autocomplete="off"
        [(ngModel)]="textoBusqueda" [placeholder]="m.buscarPlaceholder"
        (keydown.enter)="$event.preventDefault(); buscarDireccion()" />
      <button df-button variant="primary" size="sm" type="button" [loading]="buscando()" [disabled]="buscando()"
        (click)="buscarDireccion()">{{ buscando() ? m.buscando : m.buscar }}</button>
      <button df-button variant="ghost" size="sm" type="button" (click)="volverAValencia()">{{ m.volverValencia }}</button>
      <button df-button variant="ghost" size="sm" type="button" [disabled]="!hayMarcador()" (click)="volverAMarcador()">{{ m.irMarcador }}</button>
    </div>
  }

  <!-- Región viva siempre presente: los lectores de pantalla no anuncian bien una región recién insertada. -->
  <div role="status">
    @if (mensaje(); as texto) {
      <div class="mensaje">
        <span>{{ texto }}</span>
        <button df-button variant="ghost" size="sm" type="button" [attr.aria-label]="m.cerrarMensaje" (click)="mensaje.set(null)">×</button>
      </div>
    }
  </div>

  <div #mapContainer class="lienzo" [class.lienzo-vista]="soloVista()" role="region" [attr.aria-label]="soloVista() ? m.regionVista : m.region"></div>
</div>
