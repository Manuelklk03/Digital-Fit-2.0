@let t = i18n.t().vistas.entrenar;
<app-header />
<main class="vista" id="contenido-principal">
  <h1>{{ t.titulo }}</h1>
  <p class="vista-intro">{{ t.descripcion }}</p>
  <nav [attr.aria-label]="t.navegacion">
    <ul class="vista-tarjetas">
      <li>
        <a routerLink="/entrenamientos"
          ><strong>{{ t.base }}</strong
          ><span>{{ t.baseDescripcion }}</span></a
        >
      </li>
      <li>
        <a routerLink="/mis-entrenamientos"
          ><strong>{{ t.propios }}</strong
          ><span>{{ t.propiosDescripcion }}</span></a
        >
      </li>
      <li>
        <a routerLink="/entrenamientos-comunidad"
          ><strong>{{ t.comunidad }}</strong
          ><span>{{ t.comunidadDescripcion }}</span></a
        >
      </li>
    </ul>
  </nav>
</main>
<app-footer />
