server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/digital-fit;
    index index.html;

    location / {
        # /inicio, /login y /register tienen HTML prerenderizado; el resto de rutas los pinta Angular en el navegador.
        # $uri/index.html en lugar de $uri/ evita la redirección 301 de nginx a /inicio/.
        try_files $uri $uri/index.html /index.csr.html;
    }

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass_request_headers on;
        proxy_redirect off;
    }
}